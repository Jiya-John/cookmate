<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookMate</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="grocery-screen">
    <!-- Navigation bar links -->
    <nav class="top-nav">
        <a href="menu.html" class="nav-link">Home</a>
        <a href="recipe.html" class="nav-link">Recipes</a>
        <a href="grocery.html" class="nav-link">Grocery</a>
        <a href="suggestions.html" class="nav-link">Meals</a>
    </nav>

    <!-- grocery list section -->
    <main class="grocery-container">
        <h1>Grocery List</h1>                
        <div id="grocery-list" class="grocery-list-wrapper"></div>

        <!-- grocery items will be added here -->
        <div class="add-item-row">
            <!-- Add name -->
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="new-item-name" class="grocery-input-text">
            </div>
            <!-- add quantity -->
            <div class="input-group">
                <label>Qty</label>
                <input type="number" id="new-item-qty" class="grocery-input-qty">
            </div>
            <!-- add button -->
            <button id="add-btn" class="add-btn">Add</button>
        </div>
        <!-- for validation of input -->
        <p id="grocery-error-msg" class="error-msg"></p>
</body>
<script src="script.js"></script>
</html>
